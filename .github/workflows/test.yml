# Naming File
name: Test Code To Dev
# Setup Triggers
on: 
  pull_request: 
    branches: [dev, main]
# Jobs
jobs:
  test:
    name: Test the code
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          # refs/pull/${{ github.event.number }}/merge гарантирует, 
          # что мы проверяем код PR, уже виртуально смерженный с вашей веткой
          ref: refs/pull/${{ github.event.number }}/merge

      - name: setup godot
        run: sudo apt update && sudo apt install godot3-server

      - name: test
        run: godot3-server --test-only --quit
      - name: Auto-Merge Pull Request
        if: success()
        run: |
          gh pr merge ${{ github.event.number }} --auto --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      
